name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No pip install step: the project is stdlib-only by design.
      # If a dependency ever creeps in, this job starts failing.
      - name: Offline checks
        run: python scripts/selfcheck.py --offline

      - name: Network checks
        run: python scripts/selfcheck.py
